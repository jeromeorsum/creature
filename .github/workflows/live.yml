# Keeps Glorp alive on GitHub: every 30 minutes it runs one moment of Glorp's life,
# saves Glorp's memories to the "life" branch, and publishes the web view to GitHub Pages.
name: Glorp lives

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: glorp
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    timeout-minutes: 10
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TZ: ${{ vars.TZ || 'Europe/London' }}
      DAILY_BUDGET_USD: ${{ vars.DAILY_BUDGET_USD || '1.00' }}
      CREATURE_MODEL: ${{ vars.CREATURE_MODEL || 'claude-opus-5-5' }}
      CREATURE_EFFORT: ${{ vars.CREATURE_EFFORT || 'low' }}
      SLEEP_FROM_HOUR: ${{ vars.SLEEP_FROM_HOUR || '23' }}
      SLEEP_UNTIL_HOUR: ${{ vars.SLEEP_UNTIL_HOUR || '7' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Load Glorp's memories from the life branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" life >/dev/null; then
            git clone --depth 1 --branch life "$url" data
          else
            mkdir data && git -C data init -b life && git -C data remote add origin "$url"
          fi

      - name: One moment of Glorp's life
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::Add an ANTHROPIC_API_KEY repository secret so Glorp can think."
            exit 0
          fi
          node src/index.js tick

      - name: Save Glorp's memories
        run: |
          cd data
          git config user.name "Glorp"
          git config user.email "glorp@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -q -m "Glorp's life: $(date '+%a %d %b %H:%M')"
          git push -q origin life

      - name: Build the web view
        run: node src/export.js site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish to GitHub Pages
        uses: actions/deploy-pages@v4
        continue-on-error: true
