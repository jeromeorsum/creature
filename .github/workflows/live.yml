# Keeps Glorp alive on GitHub: every 10 minutes the island moves on. Glorp acts on instinct and
# passion, and only stops to think (one Claude call) when something calls for it. Each run
# saves Glorp's memories to the "life" branch, and publishes the web view to GitHub Pages.
name: Glorp lives

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      awake:
        description: "Wake Glorp up even if it's bedtime"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: glorp
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    timeout-minutes: 10
    env:
      # Use ONE of these secrets: a Claude subscription token (from `claude setup-token`) or a paid API key.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TZ: ${{ vars.TZ || 'Europe/London' }}
      DAILY_BUDGET_USD: ${{ vars.DAILY_BUDGET_USD || '1.00' }}
      MAX_TICKS_PER_DAY: ${{ vars.MAX_TICKS_PER_DAY || '40' }}
      CREATURE_MODEL: ${{ vars.CREATURE_MODEL }}
      CREATURE_EFFORT: ${{ vars.CREATURE_EFFORT || 'medium' }}
      SLEEP_FROM_HOUR: ${{ inputs.awake && '0' || vars.SLEEP_FROM_HOUR || '11' }}
      SLEEP_UNTIL_HOUR: ${{ inputs.awake && '0' || vars.SLEEP_UNTIL_HOUR || '19' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Claude Code (for subscription mode)
        if: env.CLAUDE_CODE_OAUTH_TOKEN != '' && env.ANTHROPIC_API_KEY == ''
        run: npm install -g @anthropic-ai/claude-code

      - name: Load Glorp's memories from the life branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" life >/dev/null; then
            git clone --depth 1 --branch life "$url" data
          else
            mkdir data && git -C data init -b life && git -C data remote add origin "$url"
          fi

      - name: One moment of Glorp's life
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::Add a CLAUDE_CODE_OAUTH_TOKEN repository secret (run: claude setup-token) so Glorp can think."
            exit 0
          fi
          node src/index.js tick

      - name: Save Glorp's memories
        run: |
          cd data
          git config user.name "Glorp"
          git config user.email "glorp@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -q -m "Glorp's life: $(date '+%a %d %b %H:%M')"
          git push -q origin life

      - name: Build the web view
        run: node src/export.js site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish to GitHub Pages
        uses: actions/deploy-pages@v4
        continue-on-error: true
